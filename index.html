<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Note</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" data-sidebar="open">
      <aside class="sidebar" aria-label="Study navigation">
        <div class="brand-row">
          <button class="icon-button" id="sidebarClose" type="button" aria-label="Close sidebar" title="Close sidebar">
            <span aria-hidden="true">☰</span>
          </button>
          <div>
            <strong>AI Note</strong>
            <span>paper study</span>
          </div>
        </div>

        <button class="new-note-button" id="newNoteButton" type="button">+ New note</button>
        <nav class="note-nav" id="noteNav" aria-label="Notes"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-button" id="sidebarOpen" type="button" aria-label="Open sidebar" title="Open sidebar">
            <span aria-hidden="true">☰</span>
          </button>
          <div class="topbar-title">
            <span id="currentSection">Paper Review</span>
            <strong id="currentTitle">Loading...</strong>
          </div>
          <div class="actions">
            <button id="viewButton" class="segmented active" type="button">Preview</button>
            <button id="editButton" class="segmented" type="button">Edit</button>
            <button id="deleteNoteButton" class="danger-button" type="button">Delete</button>
          </div>
        </header>

        <section class="workspace">
          <article class="preview-panel" id="previewPanel"></article>
          <section class="editor-panel hidden" id="editorPanel" aria-label="Markdown editor">
            <header class="compose-header">
              <div class="compose-kicker">
                <span id="composeModeLabel">NEW NOTE</span>
                <strong>새 노트 작성</strong>
              </div>
              <div class="compose-actions">
                <span id="saveStatus">저장 전</span>
                <button id="cancelEditButton" class="quiet-button" type="button">취소</button>
                <button id="saveLocalButton" class="quiet-button" type="button">임시저장</button>
                <button id="saveGithubButton" class="save-button" type="button">저장</button>
              </div>
            </header>

            <div class="compose-shell">
              <section class="compose-main">
                <input id="noteTitleInput" class="title-input" aria-label="Note title" placeholder="노트 제목" />
                <div class="note-meta-grid">
                  <label>
                    주제
                    <select id="subjectInput"></select>
                  </label>
                  <label>
                    태그
                    <input id="tagInput" placeholder="쉼표로 구분 (예: LLM, RAG)" />
                  </label>
                </div>

                <div class="write-tabs">
                  <button id="writeTabButton" class="tab-button active" type="button">작성</button>
                  <button id="previewTabButton" class="tab-button" type="button">미리보기</button>
                  <button id="imageButton" class="tool-button" type="button">사진</button>
                  <button id="linkButton" class="tool-button" type="button">링크</button>
                  <span>Markdown 사용 가능</span>
                </div>
                <div class="link-panel hidden" id="linkPanel">
                  <input id="linkTextInput" placeholder="링크 이름" />
                  <input id="linkUrlInput" placeholder="https://example.com" />
                  <button id="insertLinkButton" class="tool-button" type="button">넣기</button>
                </div>

                <textarea id="markdownInput" spellcheck="false"></textarea>
                <article class="compose-preview hidden" id="composePreview"></article>
                <input id="imageInput" class="hidden" type="file" accept="image/*" />
              </section>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
